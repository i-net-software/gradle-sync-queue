advanced.setting.gradle.sync.queue.group=Gradle Sync Queue
advanced.setting.gradle.sync.queue.replace.borrowed.sources=Replace source folders borrowed from other Gradle projects by module dependencies
advanced.setting.gradle.sync.queue.replace.borrowed.sources.description=Like Eclipse/Buildship: a source folder outside the module's own Gradle project (srcDirs '../Other/src') is removed after a Gradle sync and the module depends on the module of the other project instead. Without this, IDEA compiles such folders twice and ignores exclude/include patterns of the source set.
